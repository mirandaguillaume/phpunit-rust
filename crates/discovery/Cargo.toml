[package]
name = "discovery"
version = "0.7.0"
edition = "2021"
description = "Shared PHPUnit test discovery: tree-sitter-based class + method + data-provider extraction. Used by phpunit-rust runner and analyzer."
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow          = { workspace = true }
serde           = { workspace = true }
walkdir         = { workspace = true }
tree-sitter     = "0.22"
tree-sitter-php = "0.22"

[dev-dependencies]
tempfile = { workspace = true }
