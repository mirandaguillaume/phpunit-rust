[package]
name = "analyzer"
version = "0.1.0"
edition = "2021"
description = "PHP static coverage analysis — Given/When/Then test model"
license = "MIT"

[[bin]]
name = "pcov-rs"
path = "src/main.rs"

[lib]
name = "analyzer"
path = "src/lib.rs"

[dependencies]
clap         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
bincode      = { workspace = true }
blake3       = { workspace = true }
roxmltree    = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
rayon        = { workspace = true }
walkdir      = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
# Mago 1.x: mago-project/-reflection/-source/-interner were removed; their roles
# moved to mago-database (file/source model + FileId) + mago-codex (codebase
# metadata / reflection) + the arena-based mago-analyzer.
mago-analyzer    = "1.30"
mago-codex       = "1.30"
mago-database    = "1.30"
mago-syntax      = "1.30"
mago-span        = "1.30"
mago-php-version = "1.30"
mago-names       = "1.30"
mago-word        = "1.30"
bumpalo          = "3"

[dev-dependencies]
tempfile   = { workspace = true }
assert_cmd = "2"
predicates = "3"
insta      = { version = "1", features = ["json"] }
criterion  = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "analyze"
harness = false
