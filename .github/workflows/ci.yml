name: CI

on:
  # Only master pushes + PRs. A PR commit previously triggered TWO runs (push on
  # the feature branch AND pull_request on the same SHA); if either flaked, branch
  # protection blocked the merge. Now: feature branches run once (via the PR),
  # master runs on its own pushes, plus the daily cron.
  push:
    branches: [master]
  pull_request:
  # Daily run on the default branch (master) to catch external breakage
  # (dependency, registry, toolchain or runner-image changes) even without a push.
  schedule:
    - cron: "0 6 * * *"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug builds can overflow the default 8 MB stack during coverage
  # serialisation; 64 MB is safe for debug and release alike.
  RUST_MIN_STACK: "67108864"

jobs:
  build-test:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # PHP is required by parts of the test suite (e.g. `php -l` syntax checks
      # and the fork-pool integration test that drives the sample fixture).
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      # The fork-pool integration tests drive the bundled sample fixture, whose
      # vendor/ is gitignored — install it so PHPUnit's TestCase autoloads.
      - name: Install fixture dependencies (composer)
        run: composer install --no-interaction --no-progress --working-dir=crates/runner/fixtures/sample_project

      # The fork-pool worker (php/worker_fork.php) require_once's php/vendor/autoload.php
      # to load the Proust\ shim classes (TestExecutor/OutcomeBuilder). That vendor/
      # is gitignored too — without it every worker fatals at startup, which silently
      # drops outcomes and breaks data-provider row enumeration (the parity count drift).
      # --no-dev: the worker needs only the shim autoloader; PHPUnit itself comes from the
      # project's own autoload at runtime.
      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo build --workspace
        run: cargo build --workspace

      # Build the optional coverage feature so it can't bit-rot unnoticed.
      - name: cargo build -p proust --features coverage
        run: cargo build -p proust --features coverage

      - name: cargo test --workspace
        run: cargo test --workspace

      # Bench-helper shell logic is gating (the parity death-scan and the
      # auto-PR count-gate), so its self-tests run here instead of only locally.
      - name: bench shell self-tests
        run: |
          bash bench/parity_death_scan_test.sh
          bash bench/bench_table_counts_test.sh

      # Blocking: the workspace is fmt- and clippy-clean, so any new warning
      # (or unformatted code) fails CI.
      - name: cargo clippy --workspace --all-targets -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  parity:
    name: parity regression (vanilla phpunit vs proust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Install fixture dependencies (composer)
        run: composer install --no-interaction --no-progress --working-dir=crates/runner/fixtures/sample_project

      # The fork-pool worker (php/worker_fork.php) require_once's php/vendor/autoload.php
      # to load the Proust\ shim classes (TestExecutor/OutcomeBuilder). That vendor/
      # is gitignored too — without it every worker fatals at startup, which silently
      # drops outcomes and breaks data-provider row enumeration (the parity count drift).
      # --no-dev: the worker needs only the shim autoloader; PHPUnit itself comes from the
      # project's own autoload at runtime.
      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php

      - name: Build proust binary
        run: cargo build -p proust

      # Fails CI if vanilla PHPUnit and proust disagree on the
      # Tests/Assertions summary counts for the bundled sample project.
      - name: Parity check against sample_project
        run: bash scripts/parity_check.sh crates/runner/fixtures/sample_project

  parity-coverage:
    name: parity (runtime coverage, pcov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # coverage: pcov installs + enables the pcov driver, so proust's delegated
      # runtime coverage and vanilla PHPUnit both collect real line data.
      - name: Install PHP (with pcov)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: pcov

      - name: Install fixture dependencies (composer)
        run: composer install --no-interaction --no-progress --working-dir=crates/runner/fixtures/sample_project

      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php

      - name: Build proust binary
        run: cargo build -p proust

      # Fails CI if proust's delegated runtime coverage diverges — per source
      # file — from vanilla PHPUnit + PCOV. Guards the delegation (same lib, same
      # driver => must be line-for-line identical).
      - name: Runtime coverage parity against sample_project
        run: bash scripts/parity_coverage.sh crates/runner/fixtures/sample_project

  mutation-oracle:
    name: mutation (infection oracle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # pcov drives both the baseline coverage (proust) and Infection; php 8.3
      # satisfies infection/infection ^0.29's PHP floor.
      - name: Install PHP (with pcov)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov

      - name: Build proust binary (coverage feature)
        run: cargo build -p proust --release --features coverage

      # Fails CI if proust --mutate and Infection disagree on the escaped-mutant
      # set for the V1 mutator set (the correctness oracle for native mutation).
      - name: Infection oracle parity
        run: PROUST=target/release/proust bash bench/mutation_oracle_test.sh

  php-tests:
    name: php worker-shim tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pdo_sqlite is requested explicitly so the per-test DB-isolation test
      # actually RUNS here (it markTestSkipped's without a PDO driver). It uses a
      # temp-file sqlite DB, not a real server, so no service container is needed.
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: pdo_sqlite, sqlite3

      # WITH dev deps (PHPUnit ^10.5) — unlike the other jobs which install
      # --no-dev. This is the ONLY automated check of the hand-rolled
      # TestExecutor isolation semantics (per-test transaction rollback,
      # backupGlobals parity, build-once shared fixture) — the run-bare bypass
      # the worker relies on. Without this job a regression there ships unseen.
      - name: Install worker shim dependencies (composer, with dev)
        run: composer install --no-interaction --no-progress --working-dir=php

      - name: Run php/tests (Proust shim suite)
        run: php php/vendor/bin/phpunit --bootstrap php/vendor/autoload.php php/tests

  parity-functional:
    # Exercises the --provision-db per-worker-DB path that the unit/parity jobs
    # can't: a real framework app (Symfony Demo) whose functional suite isolates
    # each test via DAMADoctrineTestBundle (a PHPUnit <extensions> bootstrap) runs
    # in PARALLEL against PostgreSQL, and must match vanilla exactly. This is the
    # only automated check that the event bridge + force-provisioning + per-worker
    # DATABASE_URL injection actually compose into isolated parallel execution.
    name: parity (parallel functional tests, pg)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Host PHP is only needed for the composer step below (the worker-shim
      # vendor that worker_fork.php require_once's); the suite itself runs inside
      # the CI image. setup-php bundles composer.
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php

      - name: Build proust binary
        run: cargo build -p proust

      # The pg path needs pdo_pgsql, which lives in this image (not the bare runner).
      - name: Build CI image (with pdo_pgsql)
        run: docker build -f bench/Dockerfile.ci -t proust-ci:php84 .

      # --network host so the docker-run containers reach the pg service on
      # localhost:5432; the script clones Symfony Demo, loads schema+fixtures,
      # then gates `proust --workers 4 --provision-db` == vanilla.
      - name: Parallel functional-test parity (Symfony Demo on Postgres)
        env:
          IMAGE: proust-ci:php84
          BINARY: ${{ github.workspace }}/target/debug/proust
          DOCKER_NET: host
          PG_HOST: 127.0.0.1
          PG_PORT: "5432"
          PG_USER: postgres
          PG_PASS: pg
          PG_DB: app_test
        run: bash bench/parity_functional_pg.sh

  provision-mysql:
    # The one DBMS provisioning path the jobs above don't cover: the MySQL
    # adapter (CREATE DATABASE + per-table CREATE TABLE LIKE / INSERT SELECT) and
    # the dbHandle credential extraction (PDO MySQL can't read user=/password=
    # from the DSN). Seeds an FK template, clones per worker, and asserts the
    # clone copies schema+data, stays isolated from the template, is reachable
    # through dbHandle, and is reclaimed by gc — against a real MySQL.
    name: provision (mysql adapter)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Host PHP only for the composer step (the vendor the gate harness autoloads).
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php

      # The MySQL adapter needs pdo_mysql, which lives in this image.
      - name: Build CI image (with pdo_mysql)
        run: docker build -f bench/Dockerfile.ci -t proust-ci:php84 .

      # --network host so the container reaches the mysql service on localhost:3306.
      - name: MySQL provisioning gate
        env:
          IMAGE: proust-ci:php84
          DOCKER_NET: host
          MY_HOST: 127.0.0.1
          MY_PORT: "3306"
          MY_USER: root
          MY_PASS: root
          MY_DB: app_test
        run: bash bench/provision_mysql_smoke.sh
