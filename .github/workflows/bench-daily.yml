---
# bench-daily.yml — daily OSS benchmark, one isolated runner per box.
#
#   gate    — matrix(suite) at workers=4: the REAL parallel path users run.
#             Every suite must run the same test count as vanilla PHPUnit. This
#             BLOCKS publication. One dedicated runner per suite means workers are
#             never starved by cross-suite load.
#   diag    — matrix(suite) at workers=1: the same check, single-worker, as pure
#             DIAGNOSIS. Does NOT block. Read alongside the gate:
#               gate red + diag green = a parallel/worker issue (a worker dropped
#                                       its chunk under load);
#               gate red + diag red   = a code/env parity gap.
#   publish — workers=4 speed bench across all suites → auto-PR refreshing
#             BENCHMARKS.md. Runs only if every gate job passed.
#
# NOTE: the auto-PR needs "Allow GitHub Actions to create and approve pull
# requests" (Settings → Actions → General → Workflow permissions). The job
# summaries work regardless.

name: Daily OSS Benchmark

on:
  schedule:
    # 05:00 UTC daily (1 h offset from the existing CI cron at 06:00).
    - cron: "0 5 * * *"
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    name: parity gate · ${{ matrix.suite }} (workers=4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [brick-math, carbon, doctrine-orm, faker, guzzle-psr7, php-parser, phpunit-itself]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build phpunit-rust (release)
        run: cargo build --release -p phpunit-rust
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gmp, pdo_sqlite, pcntl
          tools: composer
      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php
      - name: Verify worker shim autoloader is present
        run: test -f php/vendor/autoload.php || { echo 'php/vendor/autoload.php missing'; exit 1; }
      - name: Make bench scripts executable
        run: chmod +x bench/*.sh
      - name: Parity (workers=4, gate)
        env:
          BINARY: ${{ github.workspace }}/target/release/phpunit-rust
          SMOKE: ${{ runner.temp }}/smoke
          WORKERS: "4"
        run: bench/parity_one.sh "${{ matrix.suite }}"

  diag:
    name: parity diag · ${{ matrix.suite }} (workers=1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [brick-math, carbon, doctrine-orm, faker, guzzle-psr7, php-parser, phpunit-itself]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build phpunit-rust (release)
        run: cargo build --release -p phpunit-rust
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gmp, pdo_sqlite, pcntl
          tools: composer
      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php
      - name: Make bench scripts executable
        run: chmod +x bench/*.sh
      - name: Parity (workers=1, diagnosis)
        env:
          BINARY: ${{ github.workspace }}/target/release/phpunit-rust
          SMOKE: ${{ runner.temp }}/smoke
          WORKERS: "1"
        run: bench/parity_one.sh "${{ matrix.suite }}"

  publish:
    name: speed bench + auto-PR
    needs: gate                 # only the workers=4 gate blocks publication
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build phpunit-rust (release)
        run: cargo build --release -p phpunit-rust
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gmp, pdo_sqlite, pcntl
          tools: composer
      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php
      - name: Make bench scripts executable
        run: chmod +x bench/*.sh

      - name: Run OSS benchmark (speed, workers=4)
        env:
          BINARY: ${{ github.workspace }}/target/release/phpunit-rust
          SMOKE: ${{ runner.temp }}/smoke
          RUNS: "3"
          WORKERS: "4"
        run: bench/run_oss_bench.sh /tmp/bench-table.md

      - name: Append table to job summary
        if: always()
        run: |
          echo "## OSS Benchmark Results (speed, workers=4)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bench-table.md >> "$GITHUB_STEP_SUMMARY" || echo "(no table generated)" >> "$GITHUB_STEP_SUMMARY"

      - name: Splice table into BENCHMARKS.md
        run: bench/update_benchmarks_table.sh /tmp/bench-table.md

      - name: Open auto-PR refreshing BENCHMARKS.md
        # Non-fatal: if the repo policy "Allow GitHub Actions to create and
        # approve pull requests" is off (or the token lacks scope), the PR step
        # fails but the run stays green — the refreshed numbers are already in
        # the job summary, and a human can open the PR from the diff if needed.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/bench-refresh
          title: "chore(bench): refresh BENCHMARKS reference table"
          body: |
            Auto-generated by the `bench-daily.yml` workflow.

            This PR refreshes the reference-run table in `BENCHMARKS.md` with
            results from the latest daily OSS benchmark run. It only opens when
            every per-suite parity gate (workers=4) passed.

            > **Note:** wall-times vary run-to-run (±5–10 % is normal);
            > only review this PR if a suite regressed by more than ~15 %.
          commit-message: "chore(bench): refresh reference table [skip ci]"
          add-paths: BENCHMARKS.md
          delete-branch: true
