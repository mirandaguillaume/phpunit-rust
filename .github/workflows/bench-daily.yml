---
# bench-daily.yml — daily OSS benchmark job that refreshes BENCHMARKS.md via auto-PR.
#
# NOTE: For the "create-pull-request" step to succeed, the repository must have
# "Allow GitHub Actions to create and approve pull requests" enabled under
# Settings → Actions → General → Workflow permissions.
# The job-summary step (which appends the table to $GITHUB_STEP_SUMMARY) works
# regardless of that setting.

name: Daily OSS Benchmark

on:
  schedule:
    # 05:00 UTC daily (1 h offset from the existing CI cron at 06:00)
    - cron: "0 5 * * *"
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Build phpunit-rust (release)
        run: cargo build --release -p phpunit-rust

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gmp, pdo_sqlite, pcntl
          tools: composer

      # CRITICAL: php/worker_fork.php require_once's php/vendor/autoload.php at
      # every worker startup; php/vendor is gitignored, so without this install
      # every fork-pool worker fatals at boot and the bench silently records
      # FRACTIONAL rust test counts (a crash that masquerades as a fast run).
      # Mirrors the same step in ci.yml. --no-dev: the shim autoloader only.
      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php

      - name: Verify worker shim autoloader is present
        run: test -f php/vendor/autoload.php || { echo 'php/vendor/autoload.php missing — workers would fatal and drop outcomes'; exit 1; }

      - name: Make bench scripts executable
        run: chmod +x bench/bench_host.sh bench/run_oss_bench.sh bench/update_benchmarks_table.sh bench/check_parity.sh

      - name: Run OSS benchmark
        env:
          BINARY: ${{ github.workspace }}/target/release/phpunit-rust
          SMOKE: ${{ runner.temp }}/smoke
          RUNS: "3"
          WORKERS: "4"
        run: bench/run_oss_bench.sh /tmp/bench-table.md

      - name: Append table to job summary
        if: always()
        run: |
          echo "## OSS Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bench-table.md >> "$GITHUB_STEP_SUMMARY" || echo "(no table generated)" >> "$GITHUB_STEP_SUMMARY"

      # Strict parity gate: refuse to publish unless EVERY suite ran the same
      # number of tests under vanilla PHPUnit and phpunit-rust. A divergence
      # means the run is not a like-for-like comparison (e.g. crashed workers,
      # or an unclosed parity gap), so the splice + auto-PR below are skipped and
      # the job goes RED. The table is already in the job summary above (which is
      # `if: always()`) so the bad numbers remain visible for diagnosis.
      - name: Parity gate (counts must match vanilla)
        run: bench/check_parity.sh /tmp/bench-table.md

      - name: Splice table into BENCHMARKS.md
        run: bench/update_benchmarks_table.sh /tmp/bench-table.md

      - name: Open auto-PR refreshing BENCHMARKS.md
        # Non-fatal: if the repo policy "Allow GitHub Actions to create and
        # approve pull requests" is off (or the token lacks scope), the PR step
        # fails but the run stays green — the refreshed numbers are already in
        # the job summary, and a human can open the PR from the diff if needed.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/bench-refresh
          title: "chore(bench): refresh BENCHMARKS reference table"
          body: |
            Auto-generated by the `bench-daily.yml` workflow.

            This PR refreshes the reference-run table in `BENCHMARKS.md` with
            results from the latest daily OSS benchmark run.

            > **Note:** wall-times vary run-to-run (±5–10 % is normal);
            > only review this PR if a suite regressed by more than ~15 %.
          commit-message: "chore(bench): refresh reference table [skip ci]"
          add-paths: BENCHMARKS.md
          delete-branch: true
