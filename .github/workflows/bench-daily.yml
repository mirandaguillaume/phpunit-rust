---
# bench-daily.yml — daily OSS benchmark, executed INSIDE a CI-faithful PHP
# container (bench/Dockerfile.ci) rather than on the bare runner.
#
# Why the container: the bare GitHub Actions runner's PHP build produces a
# per-suite test-count quirk for proust (carbon +3, doctrine +152,
# php-parser -64) that does NOT reproduce in ANY controlled environment — host
# PHP, this container, or a leaner one all show EXACT parity on every suite
# (including the 4168-test commonmark). Running in the container makes the gate
# measure CODE parity in a reproducible, user-representative environment.
#
# Layout (one isolated runner per box):
#   gate    — matrix(suite) @ workers=4, in container. Counts must match vanilla.
#             BLOCKS publication.
#   diag    — matrix(suite) @ workers=1, in container. Pure diagnosis (does NOT
#             block); read alongside the gate to localize any divergence.
#   publish — workers=4 speed bench (in container) + auto-PR. needs: gate.
#             The auto-PR opens ONLY when a suite's vanilla/rust test count
#             changed; timing-only jitter is reverted so it never spams a PR.
#
# The runner-built release binary runs in the container unchanged: it needs at
# most GLIBC_2.39 and php:8.4-cli (Debian 13) ships glibc 2.41.
#
# NOTE: the auto-PR needs "Allow GitHub Actions to create and approve pull
# requests" (Settings → Actions → General → Workflow permissions).

name: Daily OSS Benchmark

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    name: parity gate · ${{ matrix.suite }} (workers=4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [brick-math, carbon, commonmark, doctrine-orm, faker, guzzle-psr7, php-parser, phpunit-itself, rector, monolog]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build proust (release)
        run: cargo build --release -p proust
      # PHP+composer on the runner ONLY to generate the worker-shim autoloader
      # (php/vendor); the tests themselves run inside the container.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php
      - name: Build CI-faithful PHP image
        run: docker build -f bench/Dockerfile.ci -t proust-ci:php84 .
      - name: Make bench scripts executable
        run: chmod +x bench/*.sh
      - name: Parity (workers=4, in container)
        env:
          IMAGE: proust-ci:php84
          WORKERS: "4"
        run: bench/run_in_container.sh bash /work/bench/parity_one.sh "${{ matrix.suite }}"

  diag:
    name: parity diag · ${{ matrix.suite }} (workers=1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [brick-math, carbon, commonmark, doctrine-orm, faker, guzzle-psr7, php-parser, phpunit-itself, rector, monolog]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build proust (release)
        run: cargo build --release -p proust
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php
      - name: Build CI-faithful PHP image
        run: docker build -f bench/Dockerfile.ci -t proust-ci:php84 .
      - name: Make bench scripts executable
        run: chmod +x bench/*.sh
      - name: Parity (workers=1, diagnosis)
        env:
          IMAGE: proust-ci:php84
          WORKERS: "1"
        run: bench/run_in_container.sh bash /work/bench/parity_one.sh "${{ matrix.suite }}"

  publish:
    name: speed bench + auto-PR
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build proust (release)
        run: cargo build --release -p proust
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - name: Install worker shim dependencies (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php
      - name: Build CI-faithful PHP image
        run: docker build -f bench/Dockerfile.ci -t proust-ci:php84 .
      - name: Make bench scripts executable
        run: chmod +x bench/*.sh

      - name: Run OSS benchmark (speed, workers=4, in container)
        env:
          IMAGE: proust-ci:php84
          RUNS: "3"
          WORKERS: "4"
          OUT_DIR: ${{ runner.temp }}
        run: bench/run_in_container.sh bash /work/bench/run_oss_bench.sh /out/bench-table.md

      - name: Append table to job summary
        if: always()
        run: |
          echo "## OSS Benchmark Results (speed, workers=4, in container)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "${{ runner.temp }}/bench-table.md" >> "$GITHUB_STEP_SUMMARY" || echo "(no table generated)" >> "$GITHUB_STEP_SUMMARY"

      - name: Splice table into BENCHMARKS.md
        run: bench/update_benchmarks_table.sh "${{ runner.temp }}/bench-table.md"

      # Wall-times drift ±5–10 % every run, so the spliced table almost always
      # differs from HEAD — which used to open a fresh auto-PR daily even when
      # nothing parity-relevant changed (a bot PR that can't auto-merge: it
      # carries [skip ci], so required checks never run). Gate the refresh on the
      # only column that matters: the per-suite vanilla/rust test COUNT. If just
      # the timings jittered, revert the splice so the tree is clean and the next
      # step opens no PR. A genuine count change keeps the refresh and opens one.
      - name: Keep refresh only when a test count changed (skip timing jitter)
        run: |
          git show HEAD:BENCHMARKS.md > "${{ runner.temp }}/benchmarks-head.md"
          bench/bench_table_counts.sh "${{ runner.temp }}/benchmarks-head.md" > "${{ runner.temp }}/counts-head.txt"
          bench/bench_table_counts.sh BENCHMARKS.md > "${{ runner.temp }}/counts-new.txt"
          if cmp -s "${{ runner.temp }}/counts-head.txt" "${{ runner.temp }}/counts-new.txt"; then
            echo "::notice::Test counts unchanged — reverting timing-only refresh; no PR will open."
            git checkout -- BENCHMARKS.md
          else
            echo "::notice::Test counts changed — keeping refresh; auto-PR will open."
            {
              echo "### BENCHMARKS count delta (HEAD → fresh)"
              echo '```diff'
              diff "${{ runner.temp }}/counts-head.txt" "${{ runner.temp }}/counts-new.txt" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open auto-PR refreshing BENCHMARKS.md
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/bench-refresh
          title: "chore(bench): refresh BENCHMARKS reference table"
          body: |
            Auto-generated by the `bench-daily.yml` workflow (run in a CI-faithful
            PHP container). Refreshes the reference-run table in `BENCHMARKS.md`.

            Opens only when every per-suite parity gate (workers=4) passed **and**
            a suite's vanilla/rust test COUNT changed — timing-only jitter
            (±5–10 % run-to-run) no longer opens a PR. So if this PR exists, a
            parity-relevant count moved: review the count delta in the run summary.
          commit-message: "chore(bench): refresh reference table [skip ci]"
          add-paths: BENCHMARKS.md
          delete-branch: true
