[package]
name = "phpunit-rust"
version = "0.1.0"
edition = "2021"
description = "A fast PHPUnit-compatible test runner orchestrating FrankenPHP from Rust"
license = "MIT"

[[bin]]
name = "phpunit-rust"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
coverage = ["dep:pcov_rs"]

[dependencies]
anyhow = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
num_cpus = "1.16"
pcov_rs = { package = "pcov-rs", path = "../php-coverage-in-rust", optional = true }
quick-xml = "0.36"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.22"
tree-sitter-php = "0.22"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
