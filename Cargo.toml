[workspace]
members = [
    "crates/runner",
    "crates/analyzer",
    "crates/discovery",
    "crates/mock_baker",
]
resolver = "2"

[workspace.dependencies]
anyhow       = "1.0"
rayon        = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
walkdir      = "2"
tempfile     = "3"
thiserror    = "1"
bincode      = "1.3"
blake3       = "1"
roxmltree    = "0.20"
clap         = { version = "4", features = ["derive"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optimised release builds: LTO + a single codegen unit for maximum runtime
# speed (this is a performance-focused test runner), and strip debug symbols to
# keep the shipped binary small. `panic = "unwind"` is kept (the default) on
# purpose: a panic in one reader/rayon thread must not abort the whole run.
[profile.release]
lto           = true
codegen-units = 1
strip         = true
