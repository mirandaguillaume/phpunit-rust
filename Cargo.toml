[workspace]
members = [
    "crates/runner",
    "crates/analyzer",
]
resolver = "2"

[workspace.dependencies]
anyhow       = "1.0"
rayon        = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
walkdir      = "2"
tempfile     = "3"
thiserror    = "1"
bincode      = "1.3"
blake3       = "1"
roxmltree    = "0.20"
clap         = { version = "4", features = ["derive"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
